[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "uniqtoken-core"
version = "1.0.0"
description = "Research tokenizer toolkit with Unigram, BPE, SuperBPE, byte fallback, and offset tracking."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "UniqToken Authors" }
]
keywords = [
    "tokenizer",
    "unigram",
    "bpe",
    "superbpe",
    "byte-fallback",
    "multimodal",
    "nlp",
    "subword-regularization",
    "transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
requires-python = ">=3.10"
dependencies = [
    "regex>=2023.0.0",
]

[project.optional-dependencies]
progress = [
    "tqdm>=4.65.0"
]
torch = [
    "torch>=2.13.0"
]
huggingface = [
    "tokenizers>=0.22.0",
    "transformers>=5.10.4,<6.0.0",
    "huggingface_hub>=1.5.0"
]
test = [
    "pytest>=7.0.0",
    "coverage>=7.0.0",
    "ruff==0.16.8",
    "mypy==1.19.1",
    "torch==2.13.0",
    "pyarrow==23.0.1",
    "accelerate==1.15.0",
    "tokenizers>=0.22.0",
    "transformers==5.10.4",
    "huggingface_hub>=1.5.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.7.0",
    "jinja2>=3.1",
    "hypothesis>=6.0.0",
]
tiktoken = [
    "tiktoken>=0.7.0"
]
chat = [
    "jinja2>=3.1"
]
bench = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "torch>=2.13.0",
    "pyarrow>=23.0.1",
    "accelerate>=1.15.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.22.0",
    "transformers>=5.10.4,<6.0.0",
    "tiktoken>=0.7.0"
]
all = [
    "torch==2.13.0",
    "pyarrow==23.0.1",
    "accelerate==1.15.0",
    "tokenizers>=0.22.0",
    "transformers>=5.10.4,<6.0.0",
    "huggingface_hub>=1.5.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.7.0",
    "pytest>=7.0.0",
    "ruff==0.16.8",
    "mypy==1.19.1",
    "tqdm>=4.65.0",
    "jinja2>=3.1",
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/umran666/uniqtoken"
Repository = "https://github.com/umran666/uniqtoken"

[project.scripts]
uniqtoken = "uniqtoken.cli:main"

[tool.maturin]
manifest-path = "crates/uniqtoken_core/Cargo.toml"
python-source = "."
python-packages = ["uniqtoken", "uniqtoken_core", "benchmarks"]
module-name = "uniqtoken_core.uniqtoken_core"
bindings = "pyo3"
exclude = [
    "benchmarks/legacy/**",
    "benchmarks/*.md",
    "benchmarks/*.json",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "build",
    "dist",
    ".mypy_cache",
    ".ruff_cache",
    "uniqtoken.egg-info",
    "crates",
]

[tool.ruff.format]
# These exact blobs are part of the fail-closed Phase A migration provenance.
exclude = [
    "benchmarks/run_phase_a.py",
    "benchmarks/run_research_experiments.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E741",
    "E731",
    "E402",
    "F401",
    "F841",
    "F403",
    "F405",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
