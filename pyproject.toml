[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniqtoken"
version = "1.0.0"
description = "High-precision Byte-Fallback Unigram and Multimodal Tokenizer with dual-offset tracking and subword regularization."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "UniqToken Authors" }
]
keywords = [
    "tokenizer",
    "unigram",
    "bpe",
    "superbpe",
    "byte-fallback",
    "multimodal",
    "nlp",
    "subword-regularization",
    "transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
requires-python = ">=3.9"
dependencies = [
    "regex>=2023.0.0",
]

[project.optional-dependencies]
progress = [
    "tqdm>=4.65.0"
]
torch = [
    "torch>=2.0.0"
]
huggingface = [
    "tokenizers>=0.13.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.20.0"
]
test = [
    "pytest>=7.0.0",
    "coverage>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "sentencepiece>=0.1.99",
]
tiktoken = [
    "tiktoken>=0.7.0"
]
bench = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.13.0",
    "transformers>=4.30.0",
    "tiktoken>=0.7.0"
]
all = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.20.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.7.0",
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "tqdm>=4.65.0"
]

[project.urls]
Homepage = "https://github.com/umran666/uniqtoken"
Repository = "https://github.com/umran666/uniqtoken"

[project.scripts]
uniqtoken = "uniqtoken.cli:main"
caliper = "uniqtoken.cli:main"

[tool.setuptools]
packages = ["uniqtoken", "uniqtoken.multimodal", "benchmarks"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "build",
    "dist",
    ".mypy_cache",
    ".ruff_cache",
    "caliper_tokenizer.egg-info",
    "uniqtoken.egg-info",
    "crates",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E741",
    "E731",
    "E402",
    "F401",
    "F841",
    "F403",
    "F405",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
