[package]
name = "uniqtoken-core"
version = "1.0.0"
edition = "2021"
authors = ["UniqToken Authors"]
description = "High-performance native Rust core acceleration engine for UniqToken"
license = "MIT"

[lib]
name = "uniqtoken_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"] }
ahash = "0.8"
rayon = "1.10"
regex = "1.10"
unicode-normalization = "0.1"
unicode-general-category = "1.1"
unicode-segmentation = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
