## cbindgen configuration for the UniqToken C-ABI header (issue #22).
##
## Regenerate `include/uniqtoken.h` (run from the crate directory, since
## cbindgen resolves the crate through the local manifest):
##   cd crates/uniqtoken_core && \
##     cbindgen --config cbindgen.toml --crate uniqtoken-core \
##       --output /tmp/uniqtoken.h && \
##     diff /tmp/uniqtoken.h include/uniqtoken.h
## CI enforces that the committed header matches a fresh generation.

language = "C"
include_guard = "uniqtoken"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify manually. */"
sys_includes = ["stdint.h", "stddef.h"]
include_version = true
usize_is_size_t = true
documentation = true
