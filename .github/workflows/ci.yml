name: UniqToken Tokenizer CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust core
        run: cargo check --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets

      - name: Lint Rust core
        run: cargo clippy --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust core
        run: cargo test --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets

      - name: Build and test standalone C++ llama.cpp adapter (with ASan & UBSan)
        run: |
          cargo build --manifest-path crates/uniqtoken_core/Cargo.toml --release --no-default-features --features c_abi
          g++ -std=c++17 -O2 -fsanitize=address,undefined -Iexamples/llamacpp_adapter examples/llamacpp_adapter/uniqtoken_llama.cpp -Lcrates/uniqtoken_core/target/release -luniqtoken_core -Wl,-rpath,crates/uniqtoken_core/target/release -Wl,--no-allow-shlib-undefined -o uniqtoken_llama
          ./uniqtoken_llama crates/uniqtoken_core/demo_vocab.json

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build & Test Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install ruff mypy pytest coverage maturin regex tokenizers transformers sentencepiece tiktoken jinja2

      - name: Build & Install Native Extension (fresh from source)
        run: |
          python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          python -m maturin build --release --manifest-path crates/uniqtoken_core/Cargo.toml -o dist
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/uniqtoken_core*.whl') + glob.glob('dist/uniqtoken-core*.whl') + glob.glob('dist/*.whl'); print('Installing:', wheels[0]); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"

      - name: Install UniqToken Tokenizer (Editable)
        run: |
          python -m pip install -e .

      - name: Lint (Ruff)
        run: |
          python -m ruff check .

      - name: Formatting (Ruff)
        run: |
          python -m ruff format --check .

      - name: Type Check (Mypy)
        run: |
          python -m mypy .

      - name: Run Full Test Suite (Unit & Property Fuzzing)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Empirical Benchmark Suite Smoke Test
        run: |
          python benchmarks/benchmark_suite.py

      - name: Verify Package Build
        run: |
          python -m build

  native-wheels:
    name: Native wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build sdist + wheels for all supported Pythons
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uniqtoken_core
          command: build
          args: --release --out dist --find-interpreter

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniqtoken-core-wheels-${{ matrix.os }}
          path: crates/uniqtoken_core/dist/*.whl
          if-no-files-found: error

  pypi-release:
    name: Publish uniqtoken-core wheels to PyPI
    needs: [native-wheels, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no API token needed)
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*

