name: UniqToken Tokenizer CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*", "test/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust core
        run: cargo check --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets

      - name: Lint Rust core
        run: cargo clippy --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust core
        run: cargo test --manifest-path crates/uniqtoken_core/Cargo.toml --all-targets

      - name: Build and test standalone C++ llama.cpp adapter (with ASan & UBSan)
        run: |
          cargo build --manifest-path crates/uniqtoken_core/Cargo.toml --release --no-default-features --features c_abi
          g++ -std=c++17 -O2 -fsanitize=address,undefined -Iexamples/llamacpp_adapter examples/llamacpp_adapter/uniqtoken_llama.cpp -Lcrates/uniqtoken_core/target/release -luniqtoken_core -Wl,-rpath,crates/uniqtoken_core/target/release -Wl,--no-allow-shlib-undefined -o uniqtoken_llama
          ./uniqtoken_llama crates/uniqtoken_core/demo_vocab.json

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build & Test Tooling
        run: |
          python -m pip install --upgrade pip wheel build "maturin>=1.15,<2.0"

      - name: Build & Install Combined Distribution (fresh from source)
        run: |
          python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          python -m maturin build --release --out dist --interpreter python
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/uniqtoken_core*.whl'); assert len(wheels) == 1, wheels; print('Installing:', wheels[0]); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -c "import importlib.metadata, uniqtoken, uniqtoken_core; assert uniqtoken.__version__ == '1.0.0'; assert importlib.metadata.version('uniqtoken-core') == '1.0.0'; assert hasattr(uniqtoken_core, 'RustPrefixTrie')"

      - name: Install UniqToken Tokenizer (Editable)
        run: |
          python -m pip install -e ".[test]"

      - name: Lint (Ruff)
        run: |
          python -m ruff check .

      - name: Formatting (Ruff)
        run: |
          python -m ruff format --check .

      - name: Type Check (Mypy)
        run: |
          python -m mypy uniqtoken

      - name: Run Full Test Suite (Unit & Property Fuzzing)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Empirical Benchmark Suite Smoke Test
        run: |
          python benchmarks/benchmark_suite.py

      - name: Verify Package Build
        run: |
          python -m build

  native-wheels:
    name: Native wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build combined wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python

      - name: Verify clean install, uninstall, and reinstall
        shell: bash
        run: |
          wheel=$(python -c "import glob; wheels=glob.glob('dist/uniqtoken_core*.whl'); assert len(wheels) == 1, wheels; print(wheels[0])")
          python tools/verify_release_wheel.py --wheel "$wheel" --receipt "dist/packaging-verification-${{ runner.os }}.json"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniqtoken-core-wheels-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/packaging-verification-*.json
          if-no-files-found: error

  source-dist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: python -m pip install --upgrade pip "maturin>=1.15,<2.0"

      - name: Build source distribution and wheel from it
        shell: bash
        run: |
          python -m maturin sdist --out dist
          mkdir -p dist/from-sdist
          python -m pip wheel --no-deps --wheel-dir dist/from-sdist dist/uniqtoken_core-1.0.0.tar.gz
          wheel=$(python -c "import glob; wheels=glob.glob('dist/from-sdist/uniqtoken_core*.whl'); assert len(wheels) == 1, wheels; print(wheels[0])")
          python tools/verify_release_wheel.py --wheel "$wheel" --receipt dist/packaging-verification-sdist.json

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: uniqtoken-core-sdist
          path: |
            dist/uniqtoken_core-1.0.0.tar.gz
            dist/packaging-verification-sdist.json
          if-no-files-found: error

  pypi-release:
    name: Publish uniqtoken-core wheels to PyPI
    needs: [native-wheels, source-dist, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no API token needed)
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Isolate publishable distributions
        run: |
          python -c "from pathlib import Path; import shutil; out=Path('publish-dist'); out.mkdir(); files=[*Path('dist').glob('*.whl'), *Path('dist').glob('*.tar.gz')]; assert files; [shutil.copy2(path, out / path.name) for path in files]"

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing publish-dist/*

